# Weekly Digest
# Runs weekly on Monday at ~00:17 UTC

name: Weekly Digest

on:
  schedule:
    - cron: '17 0 * * 1'  # Monday 00:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  weekly-digest:
    name: Weekly Digest Generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      GH_PAT_DISPATCH: ${{ secrets.GH_PAT_DISPATCH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_DISPATCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate weekly summary
        run: |
          python -c "
          from src.index import DiscoveryIndex, EventStore
          from pathlib import Path
          import json
          from datetime import datetime, timezone, timedelta

          index = DiscoveryIndex(Path('index/discoveries.db'))
          store = EventStore(Path('index/events.jsonl'))

          # Get stats
          stats = index.get_stats()

          # Get runs from last 7 days
          since = (datetime.now(timezone.utc) - timedelta(days=7)).isoformat()
          runs = []
          for event in store.read_all():
              if event.event_type == 'run_completed' and event.timestamp >= since:
                  runs.append(event.payload)

          total_disc = sum(r.get('discoveries_new', 0) for r in runs)
          total_scored = sum(r.get('scored_count', 0) for r in runs)
          total_llm = sum(r.get('llm_calls', 0) for r in runs)

          print(f'# Weekly Digest - {datetime.now(timezone.utc).strftime(\"%Y-%m-%d\")}')
          print()
          print(f'## Summary')
          print(f'- Total discoveries (7 days): {total_disc}')
          print(f'- Total scored: {total_scored}')
          print(f'- Total LLM calls: {total_llm}')
          print(f'- Pipeline runs: {len(runs)}')
          print()
          print(f'## Index Stats')
          print(f'- Total discoveries: {stats.get(\"total_discoveries\", 0)}')
          print(f'- By tier: {stats.get(\"by_tier\", {})}')
          print(f'- By source: {stats.get(\"by_source\", {})}')
          print(f'- Avg score: {stats.get(\"avg_score\", 0)}')
          " > weekly-digest.md

      - name: Upload weekly digest
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest
          path: weekly-digest.md
          retention-days: 30

      - name: Send to Telegram (if configured)
        if: env.BOT_TOKEN != '' && env.ADMIN_USER_ID != ''
        run: |
          python -c "
          import asyncio, httpx, os
          from pathlib import Path

          async def send():
              text = Path('weekly-digest.md').read_text()
              async with httpx.AsyncClient() as client:
                  resp = await client.post(
                      f'https://api.telegram.org/bot{os.environ[\"BOT_TOKEN\"]}/sendMessage',
                      json={'chat_id': os.environ['ADMIN_USER_ID'], 'text': text[:3800], 'parse_mode': 'Markdown'}
                  )
                  print(resp.json())

          asyncio.run(send())
          "