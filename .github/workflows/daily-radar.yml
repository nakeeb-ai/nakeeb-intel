# Daily Radar Pipeline
# Runs 4x/day at ~00:17, 06:17, 12:17, 18:17 UTC

name: Daily Radar

on:
  schedule:
    # 17 minutes past the hour, 4 times daily
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip publishing'
        type: boolean
        default: false
      since_hours:
        description: 'Collection window (hours)'
        type: string
        default: '24'
      profile:
        description: 'Domain profile'
        type: choice
        options: [ai-tools, agent-engineering, both]
        default: 'both'

permissions:
  contents: write  # For committing events.jsonl
  actions: read

concurrency:
  group: event-log
  cancel-in-progress: false

jobs:
  daily-radar:
    name: Daily Radar Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      GH_PAT_DISPATCH: ${{ secrets.GH_PAT_DISPATCH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_DISPATCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify event log integrity
        run: |
          python -c "
          from src.index import EventStore
          from pathlib import Path
          store = EventStore(Path('index/events.jsonl'))
          valid, errors = store.verify_integrity()
          if not valid:
              print('::error::Event log integrity check failed:')
              for e in errors:
                  print(f'  - {e}')
              exit(1)
          print('✅ Event log integrity verified')
          "

      - name: Run pipeline
        run: |
          python -m src.cli run \
            --dry-run ${{ github.event.inputs.dry_run != 'true' && 'false' || 'true' }} \
            --since-hours ${{ github.event.inputs.since_hours || '24' }} \
            --profile ${{ github.event.inputs.profile || 'both' }}

      - name: Verify database rebuild
        run: |
          python -m src.rebuild_db

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet index/events.jsonl; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push events
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/events.jsonl
          git commit -m "chore: update events.jsonl [skip ci]"
          git push

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-${{ github.run_id }}
          path: |
            index/events.jsonl
            index/discoveries.db
          retention-days: 7

      - name: Report quota usage
        if: always()
        run: |
          echo "## Quota Usage" >> $GITHUB_STEP_SUMMARY
          echo "| Provider | Calls (Run) | Calls (Daily) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          python -c "
          import yaml
          with open('config/quotas.yaml') as f:
              cfg = yaml.safe_load(f)
          for provider, data in cfg.get('providers', {}).items():
              if data.get('enabled', True):
                  print(f'| {provider} | {data.get(\"per_run_cap\", 0)} | {data.get(\"daily_cap\", 0)} | Configured |')
          " >> $GITHUB_STEP_SUMMARY